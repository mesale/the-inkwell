services:

  bookstore-postgres:
    image: postgres:16
    container_name: bookstore-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:Z
    networks:
      - bookstore-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: bookstore-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - bookstore-network

  minio:
    image: minio/minio:latest
    container_name: bookstore-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - bookstore-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: bookstore-keycloak
    # --import-realm imports any *-realm.json under /opt/keycloak/data/import on
    # startup. It is a no-op if the realm already exists, so it's safe to leave on.
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://bookstore-postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KC_SPI_THEME_DEFAULT: readbooks

      # New-style bootstrap admin vars (Keycloak 26+). The legacy KEYCLOAK_ADMIN*
      # vars are kept below for older images; on newer images they're deprecated
      # and may not create the admin, so we set both.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/themes:/opt/keycloak/themes:z
      - ./keycloak/import:/opt/keycloak/data/import:z
    networks:
      - bookstore-network
    depends_on:
      bookstore-postgres:
        condition: service_healthy


  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: bookstore-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bookstore-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: bookstore-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    networks:
      - bookstore-network
    depends_on:
      - zookeeper

  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    networks:
      - bookstore-network
    depends_on:
      bookstore-postgres:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8087:8087"

    networks:
      - bookstore-network
    environment:
      - SPRING_DATA_REDIS_HOST=bookstore-redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      discovery-service:
        condition: service_started
      redis:
        condition: service_started
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://bookstore-postgres:5432/bookstore_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=bookstore-kafka:29092
      - KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID:-bookstore-backend}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-https://the-inkwell-ebon.vercel.app}
    networks:
      - bookstore-network
    depends_on:
      bookstore-postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started


  store-service:
    build: ./store-service
    container_name: store-service
    ports:
      - "8082:8082" 
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=bookstore-kafka:29092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://bookstore-postgres:5432/bookstore_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID:-bookstore-backend}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-https://the-inkwell-ebon.vercel.app}
    networks:
      - bookstore-network
    depends_on:
      bookstore-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-service:
        condition: service_started


  book-service:
    build: ./book-service
    container_name: book-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://bookstore-postgres:5432/bookstore_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
    networks:
      - bookstore-network
    depends_on:
      bookstore-postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://bookstore-postgres:5432/bookstore_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=bookstore-kafka:29092
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_CONNECT_CLIENT_ID=${STRIPE_CONNECT_CLIENT_ID:-}
      - STRIPE_PREMIUM_PRICE_ID=${STRIPE_PREMIUM_PRICE_ID:-}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}

    networks:
      - bookstore-network

    depends_on:
      bookstore-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-service:
        condition: service_started

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://bookstore-postgres:5432/bookstore_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=bookstore-kafka:29092
    networks:
      - bookstore-network

    depends_on:
      bookstore-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-service:
        condition: service_started
      keycloak:
        condition: service_started

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8088:8088"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=bookstore-kafka:29092
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-https://the-inkwell-ebon.vercel.app}
    networks:
      - bookstore-network
    depends_on:
      kafka:
        condition: service_started
      discovery-service:
        condition: service_started

networks:
  bookstore-network:
    driver: bridge


volumes:
  postgres_data:
  keycloak_data:
  minio_data:
