server.port=8082
spring.application.name=store-service

#postgres
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/bookstore_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

#flyway
spring.flyway.enabled=true
spring.flyway.schemas=svc_store
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

#jpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=svc_store
spring.datasource.hikari.connection-init-sql=SET search_path TO svc_store

#keycloak
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/bookstore-realm/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/bookstore-realm}
keycloak.url=${KEYCLOAK_URL:http://keycloak:8080}
keycloak.realm=${KEYCLOAK_REALM:bookstore-realm}
keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:bookstore-backend}
keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}

#Kafka
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=store-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=com.bookstore.userservice.event.StoreApplicationApprovedEvent:com.bookstore.storeservice.event.StoreApplicationApprovedEvent,\
  com.bookstore.paymentservice.event.StripeAccountCreatedEvent:com.bookstore.storeservice.event.StripeAccountCreatedEvent,\
  com.bookstore.paymentservice.event.StripeAccountUpdatedEvent:com.bookstore.storeservice.event.StripeAccountUpdatedEvent,\
  com.bookstore.paymentservice.event.SubscriptionActivatedEvent:com.bookstore.storeservice.event.SubscriptionActivatedEvent,\
  com.bookstore.paymentservice.event.SubscriptionCancelledEvent:com.bookstore.storeservice.event.SubscriptionCancelledEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.bookstore.*

#minio
minio.url=${MINIO_URL:http://bookstore-minio:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=${MINIO_STORE_DOCS_BUCKET:store-docs}

#mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}

#app
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

#eureka
eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka/
eureka.instance.prefer-ip-address=true
